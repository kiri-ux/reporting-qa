<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Report QA{% endblock %}</title>
{{ head_tags|safe }}
<style>
/*
 * Vici design system - Color Palette 2025 plus the brand typeface pairing.
 *
 * Every value below is out of the brand book, not matched by eye. Atlas Blue
 * carries the chrome, Velocity Blue is the interactive hue, Parchment is the
 * page behind white cards. The secondary colors do status work only -
 * Cardinal for a failure, Gold for a warning, Teal for a pass - so the
 * palette never turns decorative on a screen whose whole job is telling you
 * what is wrong.
 *
 * Single theme on purpose. The site audit tool and the quote tool are both
 * light-only and these sit in adjacent tabs; a dark variant here would make
 * the family read as three products instead of one. Nothing is inherited from
 * the host, so the page holds up on either ground.
 */
@font-face{font-family:Agdasima;src:url('/static/fonts/Agdasima-Regular.woff2') format('woff2');
 font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Agdasima;src:url('/static/fonts/Agdasima-Bold.woff2') format('woff2');
 font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:'GT Walsheim Pro';src:url('/static/fonts/GTWalsheimPro-Regular.woff2') format('woff2');
 font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'GT Walsheim Pro';src:url('/static/fonts/GTWalsheimPro-Bold.woff2') format('woff2');
 font-weight:700;font-style:normal;font-display:swap}

:root{
 /* primary */
 --atlas:#002D58; --velocity:#0066B3; --parchment:#FDFBF7; --ink:#212121; --white:#fff;
 /* fades, straight off the fade chart */
 --atlas-50:#8096AC; --atlas-10:#E6EAEE;
 --velocity-50:#80B2D9; --velocity-10:#E6F0F7;
 --ink-50:#909090; --ink-10:#E9E9E9;
 /* secondary, status only */
 --gold:#F1B434; --cardinal:#A6192E; --plum:#78286E; --teal:#4FD4E0;
 /* roles */
 --plane:var(--parchment); --surface:var(--white);
 --line:var(--atlas-10); --line-2:#F0F2F5;
 --ink-2:#4A5560; --muted:#7A8894;
 --crit:#A6192E; --crit-bg:#FAE8EA;
 --warn:#8A6212; --warn-bg:#FDF3E0;
 --ok:#0E6E78;   --ok-bg:#E4F8FA;
 --rail:60px;
 --shadow:0 1px 2px rgba(0,45,88,.06),0 10px 26px -16px rgba(0,45,88,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
 font-family:'GT Walsheim Pro',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
 font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

/* ---- chrome ---- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--atlas);
 display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:20}
.rail a{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
 justify-content:center;color:#B9CBDC;text-decoration:none;transition:background .12s,color .12s}
.rail a:hover{background:rgba(255,255,255,.09);color:#fff}
.rail a.on{background:var(--gold);color:var(--atlas)}
.rail a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.rail svg{width:20px;height:20px;display:block}
.rail .mark{margin-bottom:10px;width:32px;height:32px}

.topbar{position:sticky;top:0;z-index:15;background:var(--surface);
 border-bottom:1px solid var(--line);min-height:58px;display:flex;align-items:center;
 gap:16px;padding:0 28px;margin-left:var(--rail)}
.topbar h1{font-family:Agdasima,'GT Walsheim Pro',sans-serif;font-size:26px;font-weight:700;
 letter-spacing:.02em;margin:0;color:var(--atlas);text-transform:uppercase;line-height:1}
.topbar .where{font-size:13px;color:var(--muted);border-left:1px solid var(--line);
 padding-left:16px}
.topbar .right{margin-left:auto;font-size:12px;color:var(--muted);
 font-variant-numeric:tabular-nums;white-space:nowrap}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:3px;
 background:linear-gradient(90deg,var(--atlas) 0%,var(--velocity) 46%,var(--teal) 100%)}

main{margin-left:var(--rail);padding:26px 28px 40px;display:flex;flex-direction:column;gap:28px;
 max-width:1260px}

/* ---- type ---- */
h1{font-family:Agdasima,sans-serif;font-size:38px;font-weight:700;margin:0;
 letter-spacing:.01em;line-height:1.05;color:var(--atlas);text-wrap:balance}
h2{font-family:Agdasima,sans-serif;font-size:15px;font-weight:700;letter-spacing:.12em;
 text-transform:uppercase;color:var(--atlas-50);margin:0 0 12px;padding-bottom:7px;
 border-bottom:1px solid var(--line)}
h3{font-family:Agdasima,sans-serif;font-size:19px;font-weight:700;letter-spacing:.01em;
 margin:0 0 6px;color:var(--atlas)}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:70ch}
a{color:var(--velocity);text-decoration:none}
a:hover{text-decoration:underline}
code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2)}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
 background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;
 box-shadow:var(--shadow)}
.cards div{background:var(--surface);padding:15px 18px}
.cards b{display:block;font-family:Agdasima,sans-serif;font-size:40px;font-weight:700;
 line-height:1;font-variant-numeric:tabular-nums;color:var(--atlas)}
.cards span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.c-fail b{color:var(--cardinal)}.c-warn b{color:var(--warn)}.c-ok b{color:var(--ok)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;
 box-shadow:var(--shadow);padding:18px 20px}

/* ---- tables ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);
 box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
th{font-family:Agdasima,sans-serif;font-size:13px;font-weight:700;letter-spacing:.09em;
 text-transform:uppercase;color:#DCE6F0;text-align:left;padding:9px 14px;
 background:var(--atlas);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--velocity-10)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- status ---- */
.pill{display:inline-block;font-family:Agdasima,sans-serif;font-size:12.5px;font-weight:700;
 letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:20px;
 white-space:nowrap;line-height:1.5}
.p-fail{background:var(--crit-bg);color:var(--crit)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-pass{background:var(--ok-bg);color:var(--ok)}
.p-info{background:var(--atlas-10);color:#3D5468}

.find{margin:0;padding-left:16px}
.find li{margin-bottom:5px}
.find b{font-weight:700}
.find span{color:var(--ink-2)}

/* ---- controls ---- */
.btn{display:inline-block;background:var(--atlas);color:#fff;border:0;border-radius:22px;
 padding:9px 20px;font-family:'GT Walsheim Pro',sans-serif;font-size:14px;font-weight:700;
 cursor:pointer;text-decoration:none;transition:background .12s}
.btn:hover{background:var(--velocity);text-decoration:none}
.btn.gold{background:var(--gold);color:var(--atlas)}
.btn.gold:hover{background:#DCA028}
.btn:focus-visible{outline:2px solid var(--velocity);outline-offset:2px}
input[type=file],input[type=text]{font:inherit;font-size:14px;padding:8px 12px;
 border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--velocity);
 box-shadow:0 0 0 3px var(--velocity-10)}

.note{background:var(--velocity-10);border-left:3px solid var(--velocity);padding:13px 17px;
 border-radius:0 9px 9px 0;color:var(--ink-2);font-size:14.5px}
.empty{color:var(--muted);font-style:italic}
.acct{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums;
 font-size:.93em}
.nw{white-space:nowrap}
/* in the DOM for filtering, not on screen */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- product chips ----
   Colors come from the product legend, so the code is doing the identifying
   and the color only reinforces it. Every chip carries its abbreviation, which
   is what makes this readable to someone who has not memorised the palette,
   and legible for anyone who cannot separate two of these hues. */
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;justify-content:center;
 font-family:Agdasima,sans-serif;font-size:13px;font-weight:700;letter-spacing:.05em;
 min-width:26px;height:20px;padding:0 7px;border-radius:5px;line-height:1;
 border:1px solid rgba(0,45,88,.14)}

/* ---- section bar with view tabs ---- */
.secbar{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
 border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px}
.secbar h2{font-family:Agdasima,sans-serif;font-size:15px;font-weight:700;
 letter-spacing:.12em;text-transform:uppercase;color:var(--atlas-50)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{font-family:'GT Walsheim Pro',sans-serif;font-size:13px;font-weight:700;
 padding:4px 12px;border-radius:16px;color:var(--ink-2);text-decoration:none}
.tabs a:hover{background:var(--velocity-10);color:var(--velocity);text-decoration:none}
.tabs a.on{background:var(--atlas);color:#fff}

/* ---- filter box + download ---- */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.tools input[type=search]{font:inherit;font-size:14px;padding:8px 13px;min-width:280px;flex:1;
 border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink)}
.tools input[type=search]:focus{outline:none;border-color:var(--velocity);
 box-shadow:0 0 0 3px var(--velocity-10)}
.tools .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
 white-space:nowrap}
tr[hidden]{display:none}

/* ---- chip tooltip ----
   A title attribute waits about a second and renders in the OS font. These
   are two-letter codes; the whole point is reading them at a glance, so the
   name has to appear as fast as the eye moves. */
.chip{position:relative}
.chip::after{content:attr(data-name);position:absolute;bottom:calc(100% + 7px);left:50%;
 transform:translateX(-50%);background:var(--atlas);color:#fff;font-family:'GT Walsheim Pro',sans-serif;
 font-size:12px;font-weight:400;letter-spacing:0;text-transform:none;white-space:nowrap;
 padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .1s;
 z-index:60;box-shadow:0 4px 14px rgba(0,45,88,.24)}
.chip::before{content:'';position:absolute;bottom:calc(100% + 2px);left:50%;
 transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--atlas);
 opacity:0;pointer-events:none;transition:opacity .1s;z-index:60}
.chip:hover::after,.chip:hover::before,.chip:focus::after,.chip:focus::before{opacity:1}

/* ---- back to top ---- */
.totop{position:fixed;right:22px;bottom:22px;z-index:30;width:42px;height:42px;
 border-radius:50%;background:var(--atlas);color:#fff;display:none;
 align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,45,88,.3);
 text-decoration:none;border:0;cursor:pointer}
.totop:hover{background:var(--velocity);text-decoration:none}
.totop svg{width:19px;height:19px}
.totop.show{display:flex}
details summary{cursor:pointer}

footer{margin-left:var(--rail);padding:16px 28px 34px;border-top:1px solid var(--line);
 display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted)}
footer .b{font-family:Agdasima,sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;
 text-transform:uppercase;color:var(--atlas-50)}
footer .n{margin-left:auto;max-width:58ch;text-align:right;color:var(--muted)}

@media(max-width:760px){
 :root{--rail:0px}
 .rail{position:static;width:100%;height:52px;flex-direction:row;justify-content:flex-start;
  padding:6px 12px;gap:4px}
 .rail .mark{margin:0 8px 0 0}
 .topbar{padding:12px 16px;flex-wrap:wrap;gap:8px}
 .topbar .where{border-left:0;padding-left:0}
 main,footer{padding-left:16px;padding-right:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<nav class="rail" aria-label="Sections">
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <path d="M18 15h18l10 10v24a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V17a2 2 0 0 1 2-2z" fill="#FDFBF7"/>
    <path d="M36 15l10 10H38a2 2 0 0 1-2-2z" fill="#8096AC"/>
    <rect x="22" y="30" width="14" height="3" rx="1.5" fill="#8096AC"/>
    <rect x="22" y="37" width="10" height="3" rx="1.5" fill="#8096AC"/>
    <circle cx="43" cy="43" r="11" fill="#F1B434"/>
    <path d="M38.4 43.2l3.2 3.4 6-6.6" fill="none" stroke="#002D58" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <a href="/" class="{% if nav == 'dash' %}on{% endif %}" title="Dashboard" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
      <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
    </svg></a>
  <a href="/cycle" class="{% if nav == 'cycle' %}on{% endif %}" title="This cycle" aria-label="This cycle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
      <path d="M9 14.5l2 2 4-4"/>
    </svg></a>
  <a href="/orders" class="{% if nav == 'orders' %}on{% endif %}" title="Order list" aria-label="Order list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.4" fill="currentColor"/>
      <circle cx="3.5" cy="12" r="1.4" fill="currentColor"/>
      <circle cx="3.5" cy="18" r="1.4" fill="currentColor"/>
    </svg></a>
  <a href="/partners" class="{% if nav == 'partners' %}on{% endif %}" title="Partners" aria-label="Partners">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg></a>
</nav>

<header class="topbar">
  <h1>Report QA</h1>
  <span class="where">{% block where %}{% endblock %}</span>
  <span class="right">{{ build_label }}</span>
</header>

<main>{% block body %}{% endblock %}</main>

<footer>
  <span class="b">Vici</span>
  <span>Report QA · {{ build_label }}{% if build_service and build_service != 'local' %} · {{ build_service }}{% endif %}</span>
  <span class="n">{{ build_notes }}</span>
</footer>

<button class="totop" id="totop" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function () {
  // Back to top. These tables run to a couple of thousand rows.
  var btn = document.getElementById('totop');
  var onScroll = function () { btn.classList.toggle('show', window.scrollY > 600); };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  btn.addEventListener('click', function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  // Filter. Matching runs against the row's own text, cached once, so typing
  // over two thousand rows does not re-read the DOM on every keystroke.
  document.querySelectorAll('[data-filter]').forEach(function (box) {
    var table = document.getElementById(box.dataset.filter);
    if (!table) return;
    var out = document.getElementById(box.dataset.count);
    var rows = Array.prototype.map.call(table.tBodies[0].rows, function (tr) {
      return { tr: tr, hay: tr.textContent.toLowerCase() };
    });
    var total = rows.length, t;
    var run = function () {
      var q = box.value.toLowerCase().trim();
      // Space-separated words all have to match, in any order, so
      // "7 mountains ctv" narrows instead of finding nothing.
      var terms = q ? q.split(/\s+/) : [];
      var shown = 0;
      rows.forEach(function (r) {
        var hit = terms.every(function (w) { return r.hay.indexOf(w) !== -1; });
        r.tr.hidden = !hit;
        if (hit) shown++;
      });
      if (out) out.textContent = shown === total
        ? total.toLocaleString() + ' rows'
        : shown.toLocaleString() + ' of ' + total.toLocaleString() + ' rows';
    };
    box.addEventListener('input', function () { clearTimeout(t); t = setTimeout(run, 90); });
    run();
  });
})();
</script>
</body></html>
